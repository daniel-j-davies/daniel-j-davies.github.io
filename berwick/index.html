<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Berwick upon Tweed 1100–1500</title>
<meta name="description" content="An interactive companion to a study of Berwick-upon-Tweed, c. 1100–1500: the town and its sieges, the March, who held and governed it, its port and sea links, the garrison, petitions to the crown, and the books and manuscripts that place it.">
<meta name="author" content="Daniel Davies">
<link rel="canonical" href="https://danieldavies.co/berwick/">
<meta property="og:title" content="Berwick upon Tweed 1100–1500">
<meta property="og:description" content="Berwick-upon-Tweed between England and Scotland, c. 1100–1500: town, March, governance, port, garrison, petitions and texts.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://danieldavies.co/berwick/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f5e5b'/%3E%3Cpath d='M9 26V11h3v3h2.5v-3h3v3H20v-3h3v15z' fill='%23fff'/%3E%3Cpath d='M14.5 26v-5a1.5 1.5 0 0 1 3 0v5z' fill='%231f5e5b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: one-screen atlas, same model as Merchant London. Top bar with view tabs; map views = working surface + 380px side panel (stacks on phones); page views scroll. */
:root{
  --bg:#eceeea; --surface:#f8f9f6; --surface-2:#e2e7e2; --ink:#1b2326; --ink-2:#45525a; --ink-3:#69767d; --rule:#cbd3ce;
  --accent:#1f5e5b; --accent-ink:#ffffff;           /* Tweed green-slate */
  --eng:#a63d2f; --sco:#3456a0; --reb:#8a6d1f;       /* who held the town */
  --ok:#2e7a4f; --weld:#9a7410; --lit:#3d6aa8;
  --sea:#d3e0e4; --land:#f3f1e9; --land-edge:#aeb9b8; --river:#6b93b0; --street:#8b8f8c; --street-2:#c7c9c3; --bldg:#e3dfd3; --green:#e3ead9;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#4a3aa7; --c8:#e34948; --c0:#9aa1a6;
  --f-display:"IM Fell English SC", "Alegreya", Georgia, serif;
  --f-serif:"Alegreya", Georgia, "Times New Roman", serif;
  --f-sans:"Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --bar-h:52px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101518; --surface:#161d21; --surface-2:#212a30; --ink:#e7ecec; --ink-2:#b2bdc1; --ink-3:#8b979c; --rule:#2c363c;
  --accent:#7fc0b8; --accent-ink:#0d1716; --eng:#e07b6c; --sco:#8ea9e8; --reb:#d4b45a; --ok:#6cc495; --weld:#d6ad48; --lit:#8fb1ea;
  --sea:#17252d; --land:#262c2f; --land-edge:#47535a; --river:#4f7c9c; --street:#8d9592; --street-2:#3d4548; --bldg:#30383b; --green:#27322a;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#2a9a2a; --c7:#9085e9; --c8:#e66767; --c0:#6d757c;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#101518; --surface:#161d21; --surface-2:#212a30; --ink:#e7ecec; --ink-2:#b2bdc1; --ink-3:#8b979c; --rule:#2c363c;
  --accent:#7fc0b8; --accent-ink:#0d1716; --eng:#e07b6c; --sco:#8ea9e8; --reb:#d4b45a; --ok:#6cc495; --weld:#d6ad48; --lit:#8fb1ea;
  --sea:#17252d; --land:#262c2f; --land-edge:#47535a; --river:#4f7c9c; --street:#8d9592; --street-2:#3d4548; --bldg:#30383b; --green:#27322a;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#2a9a2a; --c7:#9085e9; --c8:#e66767; --c0:#6d757c;
  color-scheme:dark; }
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.45;margin:0}
*{box-sizing:border-box}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{display:flex;flex-direction:column;height:100%}
.bar{display:flex;align-items:center;gap:18px;min-height:var(--bar-h);padding-inline:16px;border-bottom:1px solid var(--rule);background:var(--surface);flex:0 0 auto}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand b{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.01em}
.brand span{font-family:var(--f-serif);font-style:italic;color:var(--ink-3);font-size:15px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 11px;border-radius:6px;cursor:pointer;color:var(--ink-2);white-space:nowrap;font-weight:500;font-size:14.5px;letter-spacing:.02em}
.tab:hover{background:var(--surface-2)}
.home{white-space:nowrap;font-size:13.5px;color:var(--ink-2);text-decoration:none;border-left:1px solid var(--rule);padding-left:14px}
.home:hover{color:var(--accent)}
@media (max-width:640px){.home{display:none}}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
main{flex:1 1 auto;min-height:0;position:relative}
.view{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 380px}
.view.page{display:block;overflow:auto;padding-block:24px;padding-inline:16px}
.panel{border-left:1px solid var(--rule);background:var(--surface);overflow:auto;padding:16px 16px 32px;min-width:0}
.panel h2{font-family:var(--f-serif);font-weight:700;font-size:19px;margin:0 0 4px;text-wrap:balance}
.panel h3,.pagewrap h3.lab{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:20px 0 8px;font-weight:700}
.muted{color:var(--ink-3)} .small{font-size:13px}
.hint{font-size:13px;color:var(--ink-3);margin:6px 0 0}
.pill{display:inline-block;border:1px solid var(--rule);border-radius:999px;padding:0 8px;font-size:12px;color:var(--ink-2);white-space:nowrap;line-height:1.6}
.pill.src{border-color:var(--ok);color:var(--ok)}
.pill.lit{border-color:var(--lit);color:var(--lit)}
.pill.db{border-color:var(--accent);color:var(--accent)}
.pill.verify{border-color:var(--weld);color:var(--weld);border-style:dashed}
.note{border:1px dashed var(--rule);border-radius:8px;padding:10px 12px;margin:14px 0;font-size:13.5px;color:var(--ink-2);background:var(--bg)}
.note b{font-family:var(--f-serif)}
.card{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;margin:8px 0;background:var(--surface)}
.card h4{margin:2px 0 4px;font-family:var(--f-serif);font-size:16.5px;font-weight:700;text-wrap:balance}
.card .lab{font-size:12px;color:var(--ink-3);letter-spacing:.04em}
.card .ref{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.list{list-style:none;padding:0;margin:0}
.list li{padding:6px 0;border-bottom:1px solid var(--rule);font-size:14px}
.list li button.lk{all:unset;cursor:pointer;color:var(--ink)}
.list li button.lk:hover,.list li button.lk:focus-visible{color:var(--accent);text-decoration:underline}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:7px;padding:4px 10px;cursor:pointer;font-size:13.5px;color:var(--ink-2)}
.btn:hover{background:var(--surface-2)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;padding:2px 9px;font-size:12.5px;background:var(--surface);cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="false"]{opacity:.45}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto}
/* maps */
.mapwrap{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--sea)}
.mapwrap>svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.floating{position:absolute;z-index:5;background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.12);padding:8px 10px;font-size:13px}
.ctl-tr{top:12px;right:12px;display:flex;flex-direction:column;gap:8px;max-width:min(270px,calc(100% - 24px))}
.ctl-bl{left:12px;bottom:26px;right:12px;max-width:640px}
.credit{position:absolute;right:8px;bottom:4px;z-index:4;font-size:11px;color:var(--ink-3);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:1px 6px;border-radius:4px;max-width:calc(100% - 16px)}
.zoomctl{position:absolute;left:12px;top:12px;z-index:5;display:flex;flex-direction:column;gap:4px}
.zoomctl button{width:30px;height:30px;border:1px solid var(--rule);border-radius:7px;background:var(--surface);cursor:pointer;font-size:16px;line-height:1;color:var(--ink-2)}
.mapwrap path{vector-effect:non-scaling-stroke}
.mk{cursor:pointer}
.mk:focus{outline:none}
.mk:focus-visible circle,.mk:focus-visible rect{stroke:var(--accent);stroke-width:3}
.lbl{font-family:var(--f-sans);font-size:12px;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.lbl.sea{stroke:var(--sea);fill:var(--ink-3);font-style:italic}
.rangebox{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rangebox input[type=range]{flex:1;min-width:120px}
.tip{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:6px 9px;font-size:13px;max-width:300px;box-shadow:0 2px 10px rgba(0,0,0,.15);pointer-events:none}
/* pages */
.pagewrap{max-width:1080px;margin:0 auto}
.pagewrap h1{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0 0 4px;letter-spacing:.01em;text-wrap:balance}
.lede{font-family:var(--f-serif);font-size:17px;color:var(--ink-2);max-width:68ch;margin:4px 0 18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px}
.fig{border:1px solid var(--rule);border-radius:10px;background:var(--surface);padding:14px 14px 10px;min-width:0}
.fig h3{font-family:var(--f-serif);font-size:18px;margin:0 0 2px;font-weight:700;text-wrap:balance}
.fig .sub{font-size:13px;color:var(--ink-3);margin:0 0 8px;max-width:72ch}
.fig .plot{width:100%;overflow-x:auto}
.fig svg{display:block}
.fig svg text{fill:var(--ink-2);font-family:var(--f-sans)}
.axis path,.axis line{stroke:var(--rule)}
.axis text{font-size:11.5px}
.gridline line{stroke:var(--rule);stroke-dasharray:2 3}
.lgd{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin:6px 0 0}
.lgd span{display:inline-flex;align-items:center;gap:5px}
details.tbl{margin-top:6px;font-size:13px}
details.tbl summary{cursor:pointer;color:var(--ink-3)}
.tblwrap{overflow-x:auto}
table.data{border-collapse:collapse;font-size:13px;width:100%}
table.data th,table.data td{border-bottom:1px solid var(--rule);padding:4px 6px;text-align:left;vertical-align:top}
table.data th{font-weight:700;color:var(--ink-2);position:sticky;top:0;background:var(--surface)}
table.data td.n{text-align:right;font-variant-numeric:tabular-nums}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.toolbar select{border:1px solid var(--rule);border-radius:7px;padding:4px 6px;background:var(--surface)}
.toolbar input[type=search]{border:1px solid var(--rule);border-radius:7px;padding:4px 8px;background:var(--surface);min-width:0;flex:1;max-width:280px}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.books .card{margin:0;display:flex;flex-direction:column;gap:4px}
.books .card .ms{font-size:13px;color:var(--ink-2)}
.checklist li{margin:4px 0}
.struct{display:grid;gap:8px}
.tier{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px}
.node{border:1px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--bg)}
.node b{font-family:var(--f-serif);font-size:15px;display:block}
.node .small{color:var(--ink-3)}
.node.crown{border-color:var(--ink-3)}
.node.burgh{border-color:var(--accent)}
.legendrow{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12.5px;color:var(--ink-2);margin-top:8px}
.quote{font-family:var(--f-serif);font-style:italic;color:var(--ink);border-left:3px solid var(--rule);padding:2px 0 2px 10px;margin:6px 0}
.ranges{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 8px}
.ranges .btn{font-size:13px}
.govband text{pointer-events:none}
.brush .selection{fill:var(--ink);fill-opacity:.08;stroke:var(--ink);stroke-width:1.2}
.voices{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px}
.voices .card{margin:0}
.voices .card .lab b{color:var(--ink)}
.siegecard{border-left:4px solid var(--c8)}
.siegecard.failed{border-left-color:var(--sco)}
.siegecard[aria-current="true"]{outline:2px solid var(--ink);outline-offset:1px}
.tagrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.commentary:empty{display:none}
@media (max-width:860px){
  .view{grid-template-columns:1fr;grid-template-rows:minmax(300px,58%) auto;overflow:auto}
  .view .mapwrap{min-height:300px}
  .panel{border-left:0;border-top:1px solid var(--rule);overflow:visible}
  .brand span{display:none}
  .ctl-tr{max-width:200px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand"><b>Berwick upon Tweed</b><span>1100–1500</span></div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button class="tab" role="tab" id="t-town" aria-selected="true" data-v="town">Town</button>
      <button class="tab" role="tab" id="t-march" aria-selected="false" data-v="march">March</button>
      <button class="tab" role="tab" id="t-gov" aria-selected="false" data-v="gov">Control &amp; governance</button>
      <button class="tab" role="tab" id="t-sea" aria-selected="false" data-v="sea">Port &amp; sea</button>
      <button class="tab" role="tab" id="t-garrison" aria-selected="false" data-v="garrison">Garrison</button>
      <button class="tab" role="tab" id="t-petitions" aria-selected="false" data-v="petitions">Petitions</button>
      <button class="tab" role="tab" id="t-records" aria-selected="false" data-v="records">Records</button>
      <button class="tab" role="tab" id="t-books" aria-selected="false" data-v="books">Books &amp; manuscripts</button>
      <button class="tab" role="tab" id="t-people" aria-selected="false" data-v="people">Figures</button>
      <button class="tab" role="tab" id="t-sources" aria-selected="false" data-v="sources">Sources &amp; method</button>
    </nav>
    <a class="home" href="https://danieldavies.co/">Daniel Davies</a>
  </header>
  <main>
    <!-- TOWN -->
    <section class="view" id="v-town" role="tabpanel" aria-labelledby="t-town">
      <div class="mapwrap" id="townwrap">
        <svg id="townsvg" role="img" aria-label="Map of Berwick"></svg>
        <div class="zoomctl"><button id="tz-in" aria-label="Zoom in">+</button><button id="tz-out" aria-label="Zoom out">−</button><button id="tz-fit" aria-label="Fit to town" title="Fit">⤢</button></div>
        <div class="floating ctl-tr">
          <div class="seg" role="group" aria-label="Base map"><button id="tb-modern" aria-pressed="true">Modern plan</button><button id="tb-speed" aria-pressed="false">Speed, 1610</button></div>
          <div class="seg" role="group" aria-label="Layer"><button id="tm-places" aria-pressed="true">Places</button><button id="tm-sieges" aria-pressed="false">Sieges</button><button id="tm-freiris" aria-pressed="false">Freiris</button></div>
          <div class="chips" id="townChips"></div>
        </div>
        <div class="credit" id="townCredit"></div>
      </div>
      <aside class="panel" id="townPanel"></aside>
    </section>
    <!-- MARCH -->
    <section class="view" id="v-march" role="tabpanel" aria-labelledby="t-march" hidden>
      <div class="mapwrap" id="marchwrap">
        <svg id="marchsvg" role="img" aria-label="Map of the Anglo-Scottish march"></svg>
        <div class="zoomctl"><button id="mz-in" aria-label="Zoom in">+</button><button id="mz-out" aria-label="Zoom out">−</button><button id="mz-fit" aria-label="Fit" title="Fit">⤢</button></div>
        <div class="floating ctl-tr">
          <div class="chips" id="marchChips"></div>
          <label class="small"><input type="checkbox" id="m-up" checked> Land over 300 m</label>
          <label class="small"><input type="checkbox" id="m-border" checked> Modern border</label>
          <label class="small"><input type="checkbox" id="m-sieges" checked> Sieges and assaults</label>
        </div>
        <div class="floating ctl-bl">
          <div class="rangebox"><span class="small">Events from</span><input type="range" id="m-y0" min="1170" max="1510" value="1170" aria-label="From year"><span class="small">to</span><input type="range" id="m-y1" min="1170" max="1510" value="1510" aria-label="To year"><b class="num small" id="m-yl"></b></div>
          <svg id="marchRibbon" height="34" style="width:100%;display:block;margin-top:4px" aria-label="Who held Berwick"></svg>
        </div>
        <div class="credit">Relief: Mapzen/AWS terrain tiles · Coast and border: Natural Earth · Rivers © OpenStreetMap contributors</div>
      </div>
      <aside class="panel" id="marchPanel"></aside>
    </section>
    <!-- GOVERNANCE -->
    <section class="view page" id="v-gov" role="tabpanel" aria-labelledby="t-gov" hidden><div class="pagewrap" id="govBody"></div></section>
    <!-- SEA -->
    <section class="view" id="v-sea" role="tabpanel" aria-labelledby="t-sea" hidden>
      <div class="mapwrap" id="seawrap">
        <svg id="seasvg" role="img" aria-label="Map of the North Sea world"></svg>
        <div class="zoomctl"><button id="sz-in" aria-label="Zoom in">+</button><button id="sz-out" aria-label="Zoom out">−</button><button id="sz-fit" aria-label="Fit" title="Fit">⤢</button></div>
        <div class="floating ctl-tr">
          <div class="seg" role="group" aria-label="Layer"><button id="sl-links" aria-pressed="true">Documented links</button><button id="sl-ports" aria-pressed="false">Ships' home ports</button></div>
          <div class="chips" id="seaChips"></div>
        </div>
        <div class="floating ctl-bl" id="seaRange">
          <div class="rangebox"><span class="small">Years from</span><input type="range" id="s-y0" min="1280" max="1470" value="1280" aria-label="From year"><span class="small">to</span><input type="range" id="s-y1" min="1280" max="1470" value="1470" aria-label="To year"><b class="num small" id="s-yl"></b></div>
        </div>
        <div class="credit">Coastline: Natural Earth</div>
      </div>
      <aside class="panel" id="seaPanel"></aside>
    </section>
    <!-- GARRISON -->
    <section class="view page" id="v-garrison" role="tabpanel" aria-labelledby="t-garrison" hidden><div class="pagewrap" id="garBody"></div></section>
    <!-- PETITIONS -->
    <section class="view page" id="v-petitions" role="tabpanel" aria-labelledby="t-petitions" hidden><div class="pagewrap" id="petBody"></div></section>
    <!-- RECORDS -->
    <section class="view page" id="v-records" role="tabpanel" aria-labelledby="t-records" hidden><div class="pagewrap" id="recBody"></div></section>
    <!-- BOOKS -->
    <section class="view page" id="v-books" role="tabpanel" aria-labelledby="t-books" hidden><div class="pagewrap" id="bookBody"></div></section>
    <!-- PEOPLE -->
    <section class="view" id="v-people" role="tabpanel" aria-labelledby="t-people" hidden>
      <div class="mapwrap" id="pplwrap">
        <svg id="pplsvg" role="img" aria-label="Map of a figure's places"></svg>
        <div class="zoomctl"><button id="pz-in" aria-label="Zoom in">+</button><button id="pz-out" aria-label="Zoom out">−</button><button id="pz-fit" aria-label="Fit" title="Fit">⤢</button></div>
        <div class="credit">Coastline: Natural Earth</div>
      </div>
      <aside class="panel" id="pplPanel"></aside>
    </section>
    <!-- SOURCES -->
    <section class="view page" id="v-sources" role="tabpanel" aria-labelledby="t-sources" hidden><div class="pagewrap" id="srcBody"></div></section>
  </main>
</div>
<div class="tip" id="tip" hidden></div>

<script>

// ---------------------------------------------------------------- shared

let A,G;
const tip=$('#tip');
function showTip(html,e){tip.innerHTML=html;tip.hidden=false;const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tip.style.left=Math.max(4,x)+'px';tip.style.top=Math.max(4,y)+'px'}
function hideTip(){tip.hidden=true}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function yearsLabel(a,b){return a===b?`${a}`:`${a}–${b}`}

function placeLL(id){ if(Array.isArray(id)) return id; const t=TOWNBY[id]; if(t) return t.ll; const r=REGBY[id]; if(r) return r.ll; const l=A.link_places[id]; if(l) return [l[1],l[2]]; const p=A.ports[id]; if(p) return [p[1],p[2]]; return null }

let TOWNBY={},REGBY={};

// ---------------------------------------------------------------- tabs
const built={};

  document.querySelectorAll('main>section').forEach(s=>s.hidden=s.id!=='v-'+v);

// generic zoomable SVG map
function makeMap(svgSel,{extent=[1,40]}={}){
  const svg=d3.select(svgSel); svg.selectAll('*').remove();
  const g=svg.append('g');
  const zoom=d3.zoom().scaleExtent(extent).on('zoom',e=>{g.attr('transform',e.transform); const k=e.transform.k; g.selectAll('.cs').attr('transform',function(){return `translate(${this.dataset.x},${this.dataset.y}) scale(${1/k})`}); svg.node().dispatchEvent(new CustomEvent('zoomed',{detail:k}))});

  return {svg,g,zoom,size(){const r=svg.node().getBoundingClientRect();return [Math.max(10,r.width),Math.max(10,r.height)]}};
}
function wireZoom(m,pre,fit){ $(`#${pre}-in`).onclick=()=>m.svg.transition().duration(250).call(m.zoom.scaleBy,1.6); $(`#${pre}-out`).onclick=()=>m.svg.transition().duration(250).call(m.zoom.scaleBy,1/1.6); $(`#${pre}-fit`).onclick=fit }
function mapLabel(g,xy,text,cls='',opts={}){const t=g.append('g').attr('class','cs').attr('data-x',xy[0]).attr('data-y',xy[1]).attr('transform',`translate(${xy[0]},${xy[1]})`).append('text').attr('class','lbl '+cls).attr('text-anchor',opts.anchor||'middle').text(text); if(opts.size)t.attr('font-size',opts.size); if(opts.ls)t.attr('letter-spacing',opts.ls); return t}

function keyAct(sel,fn){sel.attr('tabindex',0).attr('role','button').on('keydown',(e,d)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn(e,d)}})}

// ---------------------------------------------------------------- TOWN
const TT={castle:['Castle and walls','--c8'],wall:['Castle and walls','--c8'],church:['Church and hospitals','--c5'],hospital:['Church and hospitals','--c5'],street:['Streets and gates','--c1'],gate:['Streets and gates','--c1'],bridge:['Waterfront','--c4'],quay:['Waterfront','--c4'],hall:['Waterfront','--c4'],settlement:['Around the town','--c3'],battle:['Around the town','--c3']};
const OUTC={taken:'taken',surrendered:'surrendered',retaken:'taken, then retaken',failed:'failed'};
let townBase='modern', townMode='places', townSel=null, townSiege=null, townLine=null, townHidden=new Set();
function buildTown(){
  const m=makeMap('#townsvg',{extent:[1,24]}); const [W,H]=m.size();

  const modern=m.g.append('g').attr('class','modern');
  const speed=m.g.append('g').attr('class','speedbase');
  const halo=m.g.append('g'); const marks=m.g.append('g');
  const P=p=>proj(p);
  modern.append('rect').attr('x',-W).attr('y',-H).attr('width',W*3).attr('height',H*3).attr('fill','var(--sea)');
  modern.append('path').attr('d',G.town.land.map(r=>ringPath(P,r)).join('')).attr('fill','var(--land)').attr('stroke','var(--land-edge)').attr('stroke-width',.6);
  modern.append('path').attr('d',G.town.green.map(r=>ringPath(P,r)).join('')).attr('fill','var(--green)');
  modern.append('path').attr('d',G.town.buildings.map(r=>ringPath(P,r)).join('')).attr('fill','var(--bldg)');
  modern.append('path').attr('d',G.town.streets.filter(s=>!s[0]).map(s=>linePath(P,s[2])).join('')).attr('fill','none').attr('stroke','var(--street-2)').attr('stroke-width',1.1);
  modern.append('path').attr('d',G.town.streets.filter(s=>s[0]).map(s=>linePath(P,s[2])).join('')).attr('fill','none').attr('stroke','var(--street)').attr('stroke-width',1.6);
  modern.append('path').attr('d',G.town.rail.map(l=>linePath(P,l)).join('')).attr('fill','none').attr('stroke','var(--ink-3)').attr('stroke-width',1).attr('stroke-dasharray','4 3');
  modern.append('path').attr('d',G.town.piers.map(l=>linePath(P,l)).join('')).attr('fill','none').attr('stroke','var(--land-edge)').attr('stroke-width',2);
  modern.append('path').attr('d',G.town.walls.map(l=>linePath(P,l)).join('')).attr('fill','none').attr('stroke','var(--ink-3)').attr('stroke-width',2.4).attr('stroke-opacity',.55);
  mapLabel(modern,P([-1.9985,55.7742]),'Elizabethan walls (1558–70)','',{size:10.5,anchor:'start'});
  [['River Tweed',[-2.030,55.7660]],['North Sea',[-1.983,55.7790]],['Spittal',[-1.993,55.7565]]].forEach(([t,ll])=>mapLabel(modern,P(ll),t,/Sea|River/.test(t)?'sea':''));
  const SW=1993,SH=1273; const s=Math.min(W/SW,H/SH)*0.98; const ox=(W-SW*s)/2, oy=(H-SH*s)/2;
  speed.append('rect').attr('x',-W).attr('y',-H).attr('width',W*3).attr('height',H*3).attr('fill','var(--surface-2)');
  speed.append('image').attr('href','img/speed1610.jpg').attr('x',ox).attr('y',oy).attr('width',SW*s).attr('height',SH*s).attr('preserveAspectRatio','none');
  const SP=p=>[ox+p[0]*s, oy+p[1]*s];
  const TOWNC={modern:P([-2.0035,55.7705]), speed:SP([1150,600])};
  const xy=f=>townBase==='speed'?(f.sp?SP(f.sp):null):P([f.ll[1],f.ll[0]]);
  function highlightIds(){
    if(townMode==='sieges'&&townSiege){const sg=A.sieges.find(x=>x.id===townSiege); return new Set(sg.places)}
    if(townMode==='freiris'){ if(townLine!=null){const id=A.freiris.lines[townLine][1]; return new Set(id?[id]:[])} return new Set(A.freiris.lines.map(l=>l[1]).filter(Boolean))}
    if(townMode==='sieges') return new Set(A.sieges.flatMap(x=>x.places));
    return null;
  }
  function draw(){
    const isS=townBase==='speed';
    modern.attr('display',isS?'none':null); speed.attr('display',isS?null:'none');
    marks.selectAll('*').remove(); halo.selectAll('*').remove();
    const k=d3.zoomTransform(m.svg.node()).k;
    const hi=highlightIds();
    const feats=A.town.filter(f=>townMode!=='places'||!townHidden.has((TT[f.t]||['Other'])[0])).filter(f=>xy(f));
    const items=feats.map(f=>({f,xy:xy(f),on:!hi||hi.has(f.id)}));
    if(isS&&townMode==='places') A.speed_notes.forEach(n=>items.push({note:n,xy:SP(n.sp),on:true}));
    // whole-town halo when a siege or line concerns the town as a whole
    if(hi&&hi.has('berwick')){const c=TOWNC[townBase]; halo.append('g').attr('class','cs').attr('data-x',c[0]).attr('data-y',c[1]).attr('transform',`translate(${c[0]},${c[1]}) scale(${1/k})`).append('circle').attr('r',isS?Math.min(W,H)*0.33:120).attr('fill','var(--c8)').attr('fill-opacity',.07).attr('stroke','var(--c8)').attr('stroke-dasharray','6 4').attr('stroke-width',1.5)}
    const col=d=>d.note?'var(--surface)':(townMode==='sieges'&&d.on?'var(--c8)':townMode==='freiris'&&d.on?'var(--c6)':`var(${(TT[d.f.t]||['','--c0'])[1]})`);
    const gm=marks.selectAll('g.mk').data(items).join('g').attr('class','mk').attr('transform',d=>`translate(${d.xy[0]},${d.xy[1]}) scale(${1/k})`).attr('opacity',d=>d.on?1:.28);
    gm.filter(d=>d.on&&townMode!=='places').append('circle').attr('r',14).attr('fill','none').attr('stroke',d=>col(d)).attr('stroke-width',2).attr('stroke-opacity',.6);
    gm.append('circle').attr('r',d=>d.note?6:8).attr('fill',col).attr('stroke',d=>d.note?'var(--ink-2)':'var(--surface)').attr('stroke-width',2).attr('stroke-dasharray',d=>d.f&&d.f.approx?'3 2':null);
    gm.filter(d=>d.f&&townSel===d.f.id).append('circle').attr('r',13).attr('fill','none').attr('stroke','var(--ink)').attr('stroke-width',2);
    gm.append('text').attr('class','lbl').attr('x',11).attr('y',4).text(d=>d.note?d.note.name:d.f.name).attr('display',d=>d.on?null:'none');
    gm.attr('aria-label',d=>d.note?d.note.name:d.f.name)
      .on('mousemove',(e,d)=>showTip(d.note?`<b>${esc(d.note.name)}</b><br>${esc(d.note.note)}`:`<b>${esc(d.f.name)}</b>${d.f.approx?'<br><span class="muted">position approximate</span>':''}`,e)).on('mouseleave',hideTip)
      .on('click',(e,d)=>{ if(d.f) selectTown(d.f.id); else noteTown(d.note) });
    keyAct(gm,(e,d)=>{ if(d.f) selectTown(d.f.id); else noteTown(d.note) });
    $('#townCredit').innerHTML=isS?'John Speed, <i>Northumberland</i> (1610), inset plan “Barwick”; BnF scan via Wikimedia Commons, public domain. Speed’s letters are not keyed on the plate.':'Streets, walls, coast © OpenStreetMap contributors (ODbL). Dashed marker outlines: position approximate.';
    $('#townChips').hidden=townMode!=='places';
  }
  m.svg.node().addEventListener('zoomed',e=>{marks.selectAll('g.mk').attr('transform',d=>`translate(${d.xy[0]},${d.xy[1]}) scale(${1/e.detail})`)});
  function fit(instant){ const isS=townBase==='speed'; let t;
    if(isS) t=d3.zoomIdentity; else { const a=P([-2.0155,55.7745]), b=P([-1.995,55.7655]); const kk=Math.min(W/(b[0]-a[0]),H/(b[1]-a[1]))*0.85; t=d3.zoomIdentity.translate(W/2,H/2).scale(Math.max(1,kk)).translate(-(a[0]+b[0])/2,-(a[1]+b[1])/2) }
    if(instant) m.svg.call(m.zoom.transform,t); else m.svg.transition().duration(300).call(m.zoom.transform,t) }

  const setBase=b=>{townBase=b;$('#tb-modern').setAttribute('aria-pressed',b==='modern');$('#tb-speed').setAttribute('aria-pressed',b==='speed');draw();fit()};
  $('#tb-modern').onclick=()=>setBase('modern'); $('#tb-speed').onclick=()=>setBase('speed');
  const setMode=md=>{townMode=md;townSel=null;townSiege=null;townLine=null;['places','sieges','freiris'].forEach(x=>$('#tm-'+x).setAttribute('aria-pressed',x===md));draw();townPanel()};
  $('#tm-places').onclick=()=>setMode('places'); $('#tm-sieges').onclick=()=>setMode('sieges'); $('#tm-freiris').onclick=()=>setMode('freiris');
  const groups=[...new Set(Object.values(TT).map(v=>v[0]))];
  $('#townChips').innerHTML=groups.map(gname=>{const c=Object.values(TT).find(v=>v[0]===gname)[1];return `<button class="chip" aria-pressed="${!townHidden.has(gname)}" data-g="${esc(gname)}"><span class="sw" style="background:var(${c})"></span>${esc(gname)}</button>`}).join('');
  $('#townChips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const gname=b.dataset.g; if(townHidden.has(gname))townHidden.delete(gname); else townHidden.add(gname); b.setAttribute('aria-pressed',!townHidden.has(gname)); draw()});
  window.selectTown=id=>{ if(id&&townMode!=='places'){townMode='places';['places','sieges','freiris'].forEach(x=>$('#tm-'+x).setAttribute('aria-pressed',x==='places'))} townSel=id; draw(); townPanel(id)};
  window.selectSiege=(id,force)=>{ if(townMode!=='sieges'){townMode='sieges';['places','sieges','freiris'].forEach(x=>$('#tm-'+x).setAttribute('aria-pressed',x==='sieges'))} townSiege=(townSiege===id&&!force)?null:id; draw(); townPanel()};
  window.selectLine=i=>{townLine=townLine===i?null:i; draw(); townPanel()};
  window.noteTown=n=>{townSel=null; draw(); $('#townPanel').innerHTML=`<p><button class="btn" id="tback">← All places</button></p><div class="card"><div class="lab">On Speed’s plan</div><h4>${esc(n.name)}</h4><div class="small">${esc(n.note)}</div></div>`; $('#tback').onclick=()=>{townSel=null;draw();townPanel()}};

}
function evCard(e){return `<div class="card"><div class="lab num">${esc(e.d)} · <span style="color:${kc(e.k)}">${esc((KINDS[e.k]||[''])[0])}</span></div><h4>${esc(e.t)}</h4><div class="small">${esc(e.x)}</div><div class="ref">${pill(e.s)} ${esc(e.r||'')}</div></div>`}
function siegeCard(sg,cur){return `<div class="card siegecard ${sg.o==='failed'?'failed':''}" ${cur?'aria-current="true"':''} data-sg="${sg.id}" tabindex="0" role="button"><div class="lab num">${esc(sg.d)} · ${esc(A.siege_methods[sg.m]||sg.m)} · ${esc(OUTC[sg.o]||sg.o)}</div><h4>${esc(sg.by)}</h4><div class="small"><span class="muted">Held for:</span> ${esc(sg.held)}</div><div class="small">${esc(sg.x)}</div><div class="ref">${pill(sg.s)} ${esc(sg.r)}</div></div>`}
function townPanel(id){

  if(townMode==='sieges'){
    const L=A.sieges;
    P.innerHTML=`<h2>Sieges and assaults</h2><p class="small muted">Every attack on the town or castle recorded in the sources searched. Choose one to see the places involved; red cards are captures, blue are failures. Places marked on the map are those the sources name.</p>
      <div class="tagrow">${Object.entries(A.siege_methods).map(([k,v])=>`<span class="pill">${esc(v)}: ${L.filter(x=>x.m===k).length}</span>`).join('')}</div>
      <h3>${L.length} episodes, ${L[0].d.match(/\d{4}/)[0]}–${L[L.length-1].d.match(/\d{4}/)[0]}</h3>${L.map(sg=>siegeCard(sg,sg.id===townSiege)).join('')}${comment('town')}`;
    P.querySelectorAll('[data-sg]').forEach(c=>{c.onclick=()=>selectSiege(c.dataset.sg); c.onkeydown=e=>{if(e.key==='Enter')selectSiege(c.dataset.sg)}});
    const cur=P.querySelector('[aria-current="true"]'); if(cur) cur.scrollIntoView({block:'nearest'});

  }

      ${F.lines.map((l,i)=>`<div class="card" data-ln="${i}" tabindex="0" role="button" ${townLine===i?'aria-current="true" style="outline:2px solid var(--ink)"':''}><div class="quote">${esc(l[0])}</div><div class="small muted">${l[1]?esc(TOWNBY[l[1]].name):'Not placed'}</div></div>`).join('')}

    <h3>Places</h3><ul class="list">${A.town.map(f=>`<li><button class="lk" data-id="${f.id}">${esc(f.name)}</button> ${f.approx?'<span class="pill">approx.</span>':''}</li>`).join('')}</ul>
    <h3>Recorded but not placed</h3><p class="small muted">Houses named in the documents whose sites are not established; listed here rather than given an invented position.</p>
    ${A.unplaced.map(u=>`<div class="card"><h4>${esc(u.name)}</h4><div class="small">${esc(u.note)}</div><div class="ref">${pill(u.status)} ${esc(u.refs||'')}</div></div>`).join('')}
    ${comment('town')}`;
    P.querySelectorAll('.lk').forEach(b=>b.onclick=()=>selectTown(b.dataset.id)); return;
  }
  const f=TOWNBY[id]; const ev=A.events.filter(e=>e.p===id); const sg=A.sieges.filter(x=>x.places.includes(id));
  P.innerHTML=`<p><button class="btn" id="tback">← All places</button></p><h2>${esc(f.name)}</h2><p class="small muted">${esc((TT[f.t]||[''])[0])}${f.approx?' · position approximate':''}${f.sp?'':' · not identified on Speed’s plan'}</p>
  <div class="small">${esc(f.note)}</div><div class="ref small muted" style="margin-top:6px">${pill(f.status)} ${esc(f.refs||'')}</div>
  ${sg.length?`<h3>Sieges and assaults here</h3>${sg.map(x=>siegeCard(x,false)).join('')}`:''}

// ---------------------------------------------------------------- MARCH
const RT={burgh:['Burghs','--c1'],castle:['Castles','--c8'],abbey:['Religious houses','--c5'],battle:['Battles','--c2'],meeting:['Meetings and treaties','--c7'],manor:['Manors','--c3']};
let marchHidden=new Set(), marchSel=null;
function buildMarch(){
  const m=makeMap('#marchsvg',{extent:[1,12]}); const [W,H]=m.size(); const bb=G.region.bbox;
  const proj=d3.geoMercator().fitExtent([[0,0],[W,H]],{type:'MultiPoint',coordinates:[[bb[0],bb[1]],[bb[2],bb[3]],[bb[0],bb[3]],[bb[2],bb[1]]]});
  const P=p=>proj(p);
  m.g.append('rect').attr('x',-W).attr('y',-H).attr('width',W*3).attr('height',H*3).attr('fill','var(--sea)');

function stackedDecades(fig,{data,keys,colors,x0=1280,x1=1510,h=230,ylab=''}){
  const W=Math.max(520,fig.plot.clientWidth||640), M={l:44,r:10,t:10,b:26};

  const rows=dec.map(d=>{const o={d};keys.forEach(k=>o[k]=(data[d]||{})[k]||0);return o});
  const st=d3.stack().keys(keys)(rows);
  const y=d3.scaleLinear().domain([0,d3.max(rows,r=>d3.sum(keys,k=>r[k]))||1]).nice().range([h-M.b,M.t]);
  controlBands(svg.append('g'),x,h-M.b);

  svg.append('g').attr('class','axis').attr('transform',`translate(0,${h-M.b})`).call(d3.axisBottom(x).ticks(8).tickFormat(d3.format('d')));
  svg.append('g').attr('class','axis').attr('transform',`translate(${M.l},0)`).call(d3.axisLeft(y).ticks(5));
  if(ylab) svg.append('text').attr('x',4).attr('y',M.t+2).attr('font-size',11).text(ylab);
  legend(fig.lgd,[...keys.map((k,i)=>[k,colors[i],'sq']),['Berwick in Scottish hands','color-mix(in srgb,var(--sco) 25%,transparent)','sq']]);
  table(fig.tbl,['Decade',...keys,'Total'],rows.map(r=>[r.d+'s',...keys.map(k=>r[k]),d3.sum(keys,k=>r[k])]),[1,2,3,4,5,6,7]);
}

  const charts=`<h3>Customs and sailings</h3><div id="sc-cust"></div><div id="sc-month"></div><div id="sc-ports"></div><h3>Freight and volume</h3><table class="data">${A.freight.map(f=>`<tr><td>${esc(f[0])}</td><td>${esc(f[1])}<div class="small muted">${esc(f[2])}</div></td></tr>`).join('')}</table>
  <h3>Surviving customs accounts</h3><p class="small muted">${E122().length} Exchequer customs accounts and related papers for the port of Berwick (The National Archives, E 122), from the Discovery catalogue. The 1335–37 account is the source of the home-port figures. ${OGL}</p>
  <table class="data">${E122().map(a=>`<tr><td class="num" style="white-space:nowrap">${esc(a.date)}</td><td><a href="${TNA(a.id)}" target="_blank" rel="noopener">${esc(a.ref)}</a><div class="small">${esc(a.d.replace(/^Port: /,''))}</div></td></tr>`).join('')}</table>`;
  if(o.place){P.innerHTML=`<p><button class="btn" id="sback">← All links</button></p><h2>${esc(o.place.name)}</h2><p class="small muted">${o.place.ls.length} documented link${o.place.ls.length>1?'s':''} with Berwick in the chosen years.</p>${o.place.ls.map(linkCard).join('')}${comment(CURV)}`; $('#sback').onclick=()=>$('#s-y0').dispatchEvent(new Event('input')); return}
  if(o.ports){P.innerHTML=`<h2>Ships at Berwick</h2><p class="small muted">Home ports of ships customed at Berwick in 1335–36 (the particulars name home ports, never destinations). Wool ships: 20; all sailings: Lynn 16, London 8, Newcastle 7 (Donnelly 2017, p. 19).</p>
     <h3>Named ships</h3><table class="data"><thead><tr><th>Ship</th><th>Year</th><th>What</th></tr></thead><tbody>${A.ships.slice().sort((a,b)=>(a[2]||0)-(b[2]||0)).map(s=>`<tr><td><b>${esc(s[0])}</b>${s[1]?` <span class="muted">of ${esc(A.ports[s[1]][0])}</span>`:''}</td><td class="n">${s[2]||''}</td><td class="small">${esc(s[4])}<div class="muted">${pill(s[6])} ${esc(s[5])}</div></td></tr>`).join('')}</tbody></table>${charts}${comment(CURV)}`; drawSeaCharts(); return}
  P.innerHTML=`<h2>Port &amp; sea</h2><p class="small muted">Lines join Berwick to places named with it in a dated record: ships, cargoes, merchants, money, letters. Each line is a record, not a trade volume. Use the years and kinds to filter; switch to “Ships’ home ports” for the 1335–36 customs particulars.</p>
  <p class="small"><b class="num">${o.list.length}</b> links, ${yearsLabel(o.a,o.b)}.</p>${o.list.slice().sort((a,b)=>a[1]-b[1]).map(linkCard).join('')}${charts}${comment(CURV)}`;
  drawSeaCharts();
}
function drawSeaCharts(){
  // customs per year (annualised), as steps
  const el=$('#sc-cust'); if(!el) return; const W=340,H=170,M={l:40,r:8,t:8,b:22};
  el.innerHTML=`<p class="small"><b>Great custom at Berwick, £ a year</b> <span class="muted">(annualised; Donnelly 2017, Table 1)</span></p>`;
  const svg=d3.select(el).append('svg').attr('width',W).attr('height',H).attr('viewBox',`0 0 ${W} ${H}`).style('max-width','100%');
  const x=d3.scaleLinear().domain([1310,1374]).range([M.l,W-M.r]), y=d3.scaleLinear().domain([0,800]).range([H-M.b,M.t]);
  controlBands(svg.append('g'),x,H-M.b);
  svg.append('g').selectAll('rect').data(A.customs).join('rect').attr('x',d=>x(d[0])).attr('width',d=>Math.max(2,x(d[1])-x(d[0]))).attr('y',d=>y(d[4])).attr('height',d=>y(0)-y(d[4])).attr('fill','var(--c4)')
    .on('mousemove',(e,d)=>showTip(`<b>${d[2]}</b><br>£${d[4]} a year${d[3]?`<br>${d[3]} sailings`:''}${d[5]?`<br>${d[5]} cockets`:''}${d[6]?`<br><span class="muted">${d[6]}</span>`:''}`,e)).on('mouseleave',hideTip);
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${H-M.b})`).call(d3.axisBottom(x).ticks(6).tickFormat(d3.format('d')));
  svg.append('g').attr('class','axis').attr('transform',`translate(${M.l},0)`).call(d3.axisLeft(y).ticks(4));
  // months
  const el2=$('#sc-month'); el2.innerHTML=`<p class="small"><b>Sailings by month</b> <span class="muted">(customed exports; Donnelly 2017, Table 3)</span></p>`;
  const keys=Object.keys(A.months).filter(k=>k!=='labels'); const cols=['var(--c4)','var(--c2)','var(--c1)','var(--c0)'];
  const s3=d3.select(el2).append('svg').attr('width',W).attr('height',H).attr('viewBox',`0 0 ${W} ${H}`).style('max-width','100%');
  const xb=d3.scaleBand().domain(A.months.labels).range([M.l,W-M.r]).padding(.15), y3=d3.scaleLinear().domain([0,9]).range([H-M.b,M.t]);
  const xs=d3.scaleBand().domain(keys).range([0,xb.bandwidth()]);
  keys.forEach((k,i)=>s3.append('g').selectAll('rect').data(A.months[k]).join('rect').attr('x',(d,j)=>xb(A.months.labels[j])+xs(k)).attr('width',xs.bandwidth()).attr('y',d=>y3(d)).attr('height',d=>y3(0)-y3(d)).attr('fill',cols[i]).on('mousemove',(e,d)=>showTip(`${esc(k)}: <b>${d}</b>`,e)).on('mouseleave',hideTip));
  s3.append('g').attr('class','axis').attr('transform',`translate(0,${H-M.b})`).call(d3.axisBottom(xb).tickValues(['Oct','Dec','Feb','Apr','Jun','Aug']));
  s3.append('g').attr('class','axis').attr('transform',`translate(${M.l},0)`).call(d3.axisLeft(y3).ticks(4));
  const lg=document.createElement('div'); lg.className='lgd'; el2.appendChild(lg); legend(lg,keys.map((k,i)=>[k,cols[i],'sq']));
  // ports share
  const el3=$('#sc-ports'); const sh=A.sailings.share_wool_1327_33; el3.innerHTML=`<p class="small"><b>Share of Scotland’s wool exports, 1327–33</b></p>`+Object.entries(sh).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="small" style="display:grid;grid-template-columns:80px 1fr 36px;gap:6px;align-items:center"><span>${k}</span><span style="height:10px;background:${k==='Berwick'?'var(--accent)':'var(--c0)'};width:${v*2.6}%"></span><span class="num">${v}%</span></div>`).join('')+`<p class="small muted">Berwick was the fifth-busiest customs port in the British Isles, 4.6% of all dutiable exports, 1327–32 (Donnelly 2017, pp. 8–10).</p>`;
}

  const years=d3.range(1350,1460); const rows=years.map(y=>{const o={y};types.forEach(t=>o[t]=(byY.get(y)||new Map()).get(t)||0);return o});
  const W=Math.max(460,f.plot.clientWidth||520),H=240,M={l:44,r:8,t:8,b:24};

  const Wc=Math.max(460,fc.plot.clientWidth||520), rh=16, Hc=merged.length*rh+30;

  merged.forEach((d,i)=>{const yy=6+i*rh; sc.append('text').attr('x',145).attr('y',yy+11).attr('text-anchor','end').attr('font-size',11.5).text(d.k.length>24?d.k.slice(0,23)+'…':d.k);
    sc.append('rect').attr('x',xc(d.a)).attr('y',yy+3).attr('width',Math.max(3,xc(d.b+1)-xc(d.a))).attr('height',rh-6).attr('fill','var(--c1)').attr('rx',2).on('mousemove',e=>showTip(`<b>${esc(d.k)}</b><br>${yearsLabel(d.a,d.b)} · ${d.n} records`,e)).on('mouseleave',hideTip);

// ---------------------------------------------------------------- PETITIONS
const PCAT={town:['The town: mayor, burgesses, commune','var(--accent)'],burgess:['Burgesses of Berwick, singly','var(--c1)'],merchants:['Merchants and mariners','var(--c4)'],officers:['Officers, soldiers and lords','var(--c8)'],church:['Clergy and religious houses','var(--c7)'],women:['Women','var(--c5)'],scots:['Scots','var(--sco)'],crown:['The king (letters)','var(--c2)'],individuals:['Other named people','var(--c3)'],unnamed:['Not named','var(--c0)']};
const TNA=id=>`https://discovery.nationalarchives.gov.uk/details/r/${id}`;
const OGL=`Contains public sector information licensed under the <a href="https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/" target="_blank" rel="noopener">Open Government Licence v3.0</a>.`;
function buildPetitions(){
  const B=$('#petBody'), L=A.petitions;
  const np=L.filter(p=>p.kind==='petition').length, nl=L.length-np;
  B.innerHTML=`<h1>Petitions and letters</h1><p class="lede">Requests and letters to the English king and council that name Berwick, from the catalogue of The National Archives: ${np} petitions (SC 8, Ancient Petitions) and ${nl} letters (SC 1, Ancient Correspondence). Each row links to the catalogue entry.</p>
  <div class="fig" id="p-voices"><h3>Selected petitions</h3><p class="sub">Petitions from the town and from people who lived, traded or served there. Each summary paraphrases the catalogue entry; follow the reference for the full text.</p><div class="voices"></div></div>
  <div class="fig" id="p-dec" style="margin-top:18px"></div>
  <div class="fig" id="p-tab" style="margin-top:18px"><h3>All entries</h3><p class="sub">Search the catalogue text, or filter by kind and petitioner. Petitioner groups are assigned from keywords in the catalogue’s petitioner field and are a rough guide only.</p>
    <div class="toolbar"><input type="search" id="petq" placeholder="Search petitioners, requests, answers" aria-label="Search petitions and letters"><select id="petk" aria-label="Kind"><option value="">Petitions and letters</option><option value="petition">Petitions (SC 8)</option><option value="letter">Letters (SC 1)</option></select><select id="petc" aria-label="Petitioner group"><option value="">All petitioners</option>${Object.entries(PCAT).map(([k,v])=>`<option value="${k}">${esc(v[0])}</option>`).join('')}</select><span class="small muted num" id="petn"></span></div>
    <div class="tblwrap" id="pettbl" style="max-height:560px;overflow:auto"></div></div>
  <p class="small muted">Catalogue descriptions from The National Archives, Discovery, searched 6 Oct. 2026 for Berwick-upon-Tweed and phrases that name the town (an entry naming only “Berwick” without the town’s context is left out). Dates are the catalogue’s, often a reign or a bracketed estimate. ${OGL}</p>
  ${comment('petitions')}`;

let pplSel=null;
function buildPeople(){
  const m=makeMap('#pplsvg',{extent:[1,60]}); const [W,H]=m.size();
  const proj=d3.geoConicConformal().parallels([48,60]).rotate([-4,0]).fitExtent([[10,10],[W-10,H-10]],{type:'MultiPoint',coordinates:[[-8,50],[20,61],[-6,58.5],[12.6,41.6],[-4,41.8]]});
  const P=p=>proj(p);
  m.g.append('rect').attr('x',-W*2).attr('y',-H*2).attr('width',W*5).attr('height',H*5).attr('fill','var(--sea)');
  m.g.append('path').attr('d',G.sea.land.map(r=>ringPath(P,r)).join('')).attr('fill','var(--land)').attr('stroke','var(--land-edge)').attr('stroke-width',.5);
  m.g.append('path').attr('d',G.region.land.map(r=>ringPath(P,r[1])).join('')).attr('fill','var(--land)').attr('stroke','var(--land-edge)').attr('stroke-width',.3);
  const lay=m.g.append('g');
  function draw(){
    lay.selectAll('*').remove(); const k=d3.zoomTransform(m.svg.node()).k; if(!pplSel) return;
    const p=A.people.find(x=>x.id===pplSel);
    const pts=p.places.map(([id,y,w])=>{const ll=placeLL(id);return ll?{xy:P([ll[1],ll[0]]),y,w,name:placeName(id)}:null}).filter(Boolean).sort((a,b)=>a.y-b.y);
    lay.append('path').attr('d',d3.line()(pts.map(d=>d.xy))).attr('fill','none').attr('stroke','var(--accent)').attr('stroke-width',1.6).attr('stroke-dasharray','4 3');
    const gm=lay.selectAll('g').data(pts).join('g').attr('transform',d=>`translate(${d.xy[0]},${d.xy[1]}) scale(${1/k})`);
    gm.append('circle').attr('r',6).attr('fill','var(--accent)').attr('stroke','var(--surface)').attr('stroke-width',2);
    gm.append('text').attr('class','lbl').attr('x',8).attr('y',(d,i)=>4+(i%2?10:0)).text(d=>`${d.y} ${d.name}`);
    gm.on('mousemove',(e,d)=>showTip(`<b>${d.y}, ${esc(d.name)}</b><br>${esc(d.w)}`,e)).on('mouseleave',hideTip);
  }
  function fitTo(){ if(!pplSel){m.svg.transition().duration(300).call(m.zoom.transform,d3.zoomIdentity);return}
    const p=A.people.find(x=>x.id===pplSel); const xy=p.places.map(([id])=>placeLL(id)).filter(Boolean).map(ll=>P([ll[1],ll[0]]));
    const [x0,x1]=d3.extent(xy,d=>d[0]), [y0,y1]=d3.extent(xy,d=>d[1]); const kk=Math.min(40,0.7/Math.max((x1-x0+30)/W,(y1-y0+30)/H));
    m.svg.transition().duration(400).call(m.zoom.transform,d3.zoomIdentity.translate(W/2,H/2).scale(Math.max(1,kk)).translate(-(x0+x1)/2,-(y0+y1)/2)) }
  m.svg.node().addEventListener('zoomed',draw);
  wireZoom(m,'pz',fitTo);
  window.selectPerson=id=>{pplSel=id; draw(); fitTo(); pplPanel()};
  function pplPanel(){
    const Pn=$('#pplPanel');
    const list=`<ul class="list">${A.people.map(p=>`<li><button class="lk" data-id="${p.id}"><b>${esc(p.name)}</b></button> <span class="small muted">${esc(p.dates)}</span><div class="small muted">${esc(p.role)}</div></li>`).join('')}</ul>`;
    if(!pplSel){Pn.innerHTML=`<h2>Figures</h2><p class="small muted">People tied to Berwick by office, trade, writing or captivity. Choose one to draw the places the sources put them, in date order.</p>${list}${comment(CURV)}`}
    else{const p=A.people.find(x=>x.id===pplSel); Pn.innerHTML=`<p><button class="btn" id="pback">← All figures</button></p><h2>${esc(p.name)}</h2><p class="small muted">${esc(p.dates)} · ${esc(p.role)}</p><div class="ref small">${pill(p.status)} ${esc(p.refs)}</div><h3>Places</h3><ul class="list">${p.places.slice().sort((a,b)=>a[1]-b[1]).map(([id,y,w])=>`<li><span class="num">${y}</span> · <b>${esc(placeName(id))}</b><div class="small">${esc(w)}</div></li>`).join('')}</ul><h3>Other figures</h3>${list}${comment(CURV)}`; $('#pback').onclick=()=>selectPerson(null)}
    Pn.querySelectorAll('.lk').forEach(b=>b.onclick=()=>selectPerson(b.dataset.id));
  }
  pplPanel(); selectPerson('gray');
  RESIZE.people=()=>{built.people=false; buildPeople()};
}

  <tr><td>Control &amp; governance</td><td>${A.events.length} dated events; ${A.offices.length} office-holder entries from CDS i–iv, CPR, the Foedera syllabus, Medieval Soldier and Scott 1888.</td><td>A bar runs from first to last naming in office, not a term of appointment.</td></tr>

  <tr><td>Petitions</td><td>${A.petitions.length} catalogue entries from The National Archives (SC 8 Ancient Petitions, SC 1 Ancient Correspondence), Discovery API, 6 Oct. 2026.</td><td>Catalogue descriptions, not the documents; petitioner groups assigned by keyword.</td></tr>
  <tr><td>Records</td><td>Text of 45 CPR volumes and CDS iii–iv; Glyph Machina (8 queries); TNA catalogue counts for SC 8, SC 1, E 101 and E 122.</td><td>Counts of entries; OCR errors may hide some mentions.</td></tr>
  <tr><td>Books &amp; manuscripts</td><td>${A.books.length} items; ${A.romsearch.length} editions of romances and verse searched in full text (Internet Archive).</td><td>${CONFIG.showUnverified?'Shelfmarks “to verify” unless checked in a source.':'Shelfmarks as given in the editions cited.'}</td></tr>
  <tr><td>Figures</td><td>${A.people.length} figures with dated places.</td><td>As marked.</td></tr></tbody></table></div>
  <h3 class="lab">Editions read for the second pass</h3><p class="small muted">Public-domain editions on the Internet Archive, read in their full text. Page numbers are those printed in the editions; a few are approximate and marked “c.”.</p>
  <ul class="small">${EDITIONS.map(([a,b])=>`<li><b>${esc(a)}</b>: ${esc(b)}</li>`).join('')}</ul>
  ${R?`<h3 class="lab">Needs your judgment or checking</h3><ul class="checklist small">
   <li>The romances: the full-text search (Books view) found Berwick in no Arthurian, Charlemagne or English romance edition searched. It found the town in the <i>Buke of the Howlat</i>, <i>The Freiris of Berwik</i>, the Erceldoune prophecies, Minot, Langtoft, the <i>Brut</i>, Hardyng, Barbour and Hary. The Books view keeps an empty slot for the texts the chapter discusses.</li>
   <li><i>Perceforest</i> was searched only in volumes ii, iv and v of the 1528 print, whose OCR is poor; volumes i and iii could not be downloaded.</li>
   <li><i>Charters of the Nuns of North Berwick</i> in the Berwick folder concern North Berwick, East Lothian, not Berwick-upon-Tweed.</li>
   <li>Speed’s lettered key (A–Z) is not printed on the inset; identifications on the Speed base are by eye.</li>
   <li>“John de Berewyk” and others surnamed Berwick in the English records may come from any of several English Berwicks; none is attributed to the town.</li>
   <li>Year assignments for CDS items come from the margin dates nearest each item; the Seinte Anne item was corrected from 1322 to 1347 against CPR.</li>
   <li>The Scottish keepers of 1318–33 come from Scott 1888 and are marked as secondary; the Scottish calendars and the Exchequer Rolls of Scotland were not searched.</li>
   <li>The dates of 1461 and 1482 are the conventional ones; the editions read give the year but not the day.</li>
   <li>Petitioner groups in the Petitions view come from keyword rules and misfile some entries (e.g. lords under officers).</li>
   <li>On the public build every event, office, siege, book, figure and link still marked “to verify” is hidden: ${hiddenOnSite.length} entries at present, including ${A.books.filter(b=>b.status==='verify').map(b=>b.title).slice(0,3).map(esc).join('; ')}. Places marked “to verify” stay on the maps without the mark.</li>
  </ul>
  <h3 class="lab">Still to verify (${V.length})</h3><div class="tblwrap"><table class="data"><thead><tr><th>Kind</th><th>Entry</th><th>Reference or note</th></tr></thead><tbody>${V.map(v=>`<tr><td>${esc(v[0])}</td><td>${esc(v[1])}</td><td class="small">${esc(v[2]||'')}</td></tr>`).join('')}</tbody></table></div>`:''}
  <h3 class="lab">Online databases and catalogues</h3><ul class="small">
   <li><a href="https://www.medievalsoldier.org/database/" target="_blank" rel="noopener">The Soldier in Later Medieval England</a>. Information on soldiers has been taken from the AHRC-funded ‘The Soldier in Later Medieval England Online Database’, www.medievalsoldier.org, accessed 6 October 2026.</li>
   <li><a href="https://www.englandsimmigrants.com" target="_blank" rel="noopener">England’s Immigrants 1330–1550</a>, accessed 6 October 2026.</li>
   <li><a href="https://glyphmachina.utsc.utoronto.ca/" target="_blank" rel="noopener">Glyph Machina</a>: searches run through Glyph Machina, with thanks to the Glyph Machina team and to the Anglo-American Legal Tradition project founded by the late Robert Palmer.</li>
   <li><a href="https://discovery.nationalarchives.gov.uk/" target="_blank" rel="noopener">The National Archives, Discovery</a>: catalogue descriptions of SC 8, SC 1, E 101 and E 122. ${OGL}</li>
   <li><a href="https://archive.org/" target="_blank" rel="noopener">Internet Archive</a>: full texts of the public-domain editions listed above.</li>
   <li><a href="https://cotr.ac.uk/" target="_blank" rel="noopener">The Community of the Realm in Scotland, 1249–1424</a>${R?': consulted for its editions; its viewer and search are closed to automated use.':'.'}</li>
   ${R?'<li>Not used: People of Medieval Scotland (its robots file bars AI agents by name); Corpus of Middle English and the Anglo-Norman Dictionary (bot checks). All three are worth searching by hand for Berwick.</li>':''}</ul>
  <h3 class="lab">Rights</h3><ul class="small"><li>OpenStreetMap data © OpenStreetMap contributors, ODbL. Natural Earth: public domain. Terrain: Mapzen terrain tiles on AWS (SRTM and other open sources). Speed’s plan: public-domain scan (BnF, via Wikimedia Commons).</li><li>TNA catalogue descriptions: Open Government Licence v3.0. Medieval Soldier, England’s Immigrants and Glyph Machina results are summarised and cited, with links back.</li></ul>
  ${R?'':`<h3 class="lab">Credits</h3><p class="small">The Soldier in Later Medieval England Online Database (AHRC). England’s Immigrants 1330–1550. Glyph Machina and the Anglo-American Legal Tradition. The National Archives. Printed sources: Calendar of Patent Rolls; Calendar of Documents relating to Scotland, ed. J. Bain; Calendar of Papal Letters; Foedera (syllabus, ed. T. D. Hardy); Calendar of Letter-Books of the City of London, ed. R. R. Sharpe; and the editions listed above. A. Donnelly, “An Open Economy: The Berwick Shipping Trade, 1311–1373”, <i>Scottish Historical Review</i> (2017); A. King, “Englishmen, Scots and Marchers”, <i>Northern History</i> (2000). Coastlines from Natural Earth; streets © OpenStreetMap contributors. Charts and maps by D3.</p>
  <p class="small">Concept: Daniel Davies. Data compilation, georeferencing and interface prepared with Claude (Anthropic).</p>`}
  <p class="small muted">Built ${esc(A.built)}.</p>`;
}

// ---------------------------------------------------------------- boot
const loadCommentary=()=>CONFIG.commentary?fetch(CONFIG.commentary).then(r=>r.ok?r.text():'').then(t=>{ if(!t) return; const d=document.createElement('div'); d.innerHTML=t;
  d.querySelectorAll('section[data-view]').forEach(sec=>{const html=sec.innerHTML.replace(/<!--[\s\S]*?-->/g,'').trim(); if(html) COMMENTARY[sec.dataset.view]=html})}).catch(()=>{}):Promise.resolve();
Promise.all([fetch('data/atlas.json').then(r=>r.json()),fetch('data/geo.json').then(r=>r.json()),loadCommentary()]).then(([a,g])=>{
  A=a; G=g;
  if(!CONFIG.showUnverified){
    const ok=x=>(x.s??x.status)!=='verify';
    A.events=A.events.filter(ok); A.sieges=A.sieges.filter(ok); A.sieges_region=A.sieges_region.filter(ok);
    A.books=A.books.filter(ok); A.people=A.people.filter(ok);
    A.offices=A.offices.filter(o=>o[5]!=='verify'); A.links=A.links.filter(l=>l[6]!=='verify'); A.ships=A.ships.filter(s=>s[6]!=='verify');
  }
  A.town.forEach(t=>TOWNBY[t.id]=t); A.region.forEach(r=>REGBY[r.id]=r);
  const h=location.hash.slice(1); const v=['town','march','gov','sea','garrison','petitions','records','books','people','sources'].includes(h)?h:(store('bw-view')||'town');
  show(v);
}).catch(e=>{document.querySelector('main').innerHTML=`<div class="pagewrap" style="padding:24px"><h1>Could not load the data</h1><p>${esc(e.message)}</p></div>`});
</script>
