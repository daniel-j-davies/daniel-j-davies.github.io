<style>
/* Layout: one-screen atlas in the family of the Berwick and Merchant London atlases. Top bar with view tabs (its lower edge cut like an indented chirograph); map view = working surface + 380px panel; page views scroll. */
:root{
  --bg:#e7eaee; --surface:#f6f7f9; --surface-2:#dce1e7; --ink:#191d24; --ink-2:#3f4753; --ink-3:#646e7a; --rule:#c5ccd4;
  --accent:#34426e; --accent-ink:#ffffff;            /* iron-gall indigo */
  --ok:#2e7a4f; --weld:#93700f; --lit:#3d6aa8;
  --sea:#dbe3ea; --land:#f3f2ee; --land-2:#e6e7e3; --land-edge:#a7b1bb; --river:#8fb0c8;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#4a3aa7; --c8:#e34948; --c0:#9aa1a6;
  --f-display:"Spectral SC", "Spectral", Georgia, serif;
  --f-serif:"Spectral", Georgia, "Times New Roman", serif;
  --f-sans:"Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --bar-h:52px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1217; --surface:#151a21; --surface-2:#202833; --ink:#e6e9ee; --ink-2:#b4bbc5; --ink-3:#8a939e; --rule:#2b333e;
  --accent:#a7b4e8; --accent-ink:#10141b; --ok:#6cc495; --weld:#d6ad48; --lit:#8fb1ea;
  --sea:#141c24; --land:#232931; --land-2:#1b2027; --land-edge:#46505b; --river:#4f7c9c;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#2a9a2a; --c7:#9085e9; --c8:#e66767; --c0:#6d757c;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0f1217; --surface:#151a21; --surface-2:#202833; --ink:#e6e9ee; --ink-2:#b4bbc5; --ink-3:#8a939e; --rule:#2b333e;
  --accent:#a7b4e8; --accent-ink:#10141b; --ok:#6cc495; --weld:#d6ad48; --lit:#8fb1ea;
  --sea:#141c24; --land:#232931; --land-2:#1b2027; --land-edge:#46505b; --river:#4f7c9c;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#2a9a2a; --c7:#9085e9; --c8:#e66767; --c0:#6d757c;
  color-scheme:dark; }
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.45;margin:0}
*{box-sizing:border-box}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{display:flex;flex-direction:column;height:100%}
.bar{position:relative;z-index:6;display:flex;align-items:center;gap:18px;min-height:var(--bar-h);padding-inline:16px;background:var(--surface);flex:0 0 auto}
.bar::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:6px;pointer-events:none;
  background:linear-gradient(135deg,var(--surface) 40%,transparent 41%) 0 0/10px 6px repeat-x,linear-gradient(225deg,var(--surface) 40%,transparent 41%) 0 0/10px 6px repeat-x}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand b{font-family:var(--f-display);font-weight:500;font-size:21px;letter-spacing:.02em}
.brand span{font-family:var(--f-serif);font-style:italic;color:var(--ink-3);font-size:14.5px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 11px;border-radius:6px;cursor:pointer;color:var(--ink-2);white-space:nowrap;font-weight:500;font-size:14.5px;letter-spacing:.02em}
.tab:hover{background:var(--surface-2)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
main{flex:1 1 auto;min-height:0;position:relative}
.view{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 380px}
.view.page{display:block;overflow:auto;scrollbar-gutter:stable;padding-block:28px 40px;padding-inline:16px}
.panel{border-left:1px solid var(--rule);background:var(--surface);overflow:auto;padding:18px 16px 32px;min-width:0}
.panel h2{font-family:var(--f-serif);font-weight:600;font-size:19px;margin:0 0 4px;text-wrap:balance}
h3.lab{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 8px;font-weight:700}
.muted{color:var(--ink-3)} .small{font-size:13px}
.pill{display:inline-block;border:1px solid var(--rule);border-radius:999px;padding:0 8px;font-size:12px;color:var(--ink-2);white-space:nowrap;line-height:1.6}
.pill.src{border-color:var(--ok);color:var(--ok)} .pill.db{border-color:var(--accent);color:var(--accent)} .pill.verify{border-color:var(--weld);color:var(--weld);border-style:dashed}
.note{border:1px dashed var(--rule);border-radius:8px;padding:10px 12px;margin:14px 0;font-size:13.5px;color:var(--ink-2);background:var(--bg)}
.note b{font-family:var(--f-serif)}
.card{border:1px solid var(--rule);border-left:4px solid var(--tc,var(--rule));border-radius:6px;padding:9px 12px;margin:8px 0;background:var(--surface)}
.card h4{margin:2px 0 3px;font-family:var(--f-serif);font-size:15.5px;font-weight:600;text-wrap:balance}
.card .lab{font-size:12px;color:var(--ink-3);letter-spacing:.03em}
.card .ref{font-size:12.5px;color:var(--ink-3);margin-top:4px}
.quote{font-family:var(--f-serif);font-style:italic;color:var(--ink-2);font-size:13.5px;border-left:2px solid var(--rule);padding:1px 0 1px 9px;margin:5px 0;overflow-wrap:anywhere}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:7px;padding:4px 10px;cursor:pointer;font-size:13.5px;color:var(--ink-2)}
.btn:hover{background:var(--surface-2)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;padding:2px 9px;font-size:12.5px;background:var(--surface);cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="false"]{opacity:.42}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto}
/* map */
.mapwrap{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--sea)}
.mapwrap>svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.floating{position:absolute;z-index:5;background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.12);padding:8px 10px;font-size:13px}
.ctl-tr{top:12px;right:12px;left:56px;width:max-content;margin-left:auto;display:flex;flex-direction:column;gap:8px;max-width:min(300px,calc(100% - 64px))}
.credit{position:absolute;right:8px;bottom:4px;z-index:4;font-size:11px;color:var(--ink-3);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:1px 6px;border-radius:4px;max-width:calc(100% - 16px)}
.zoomctl{position:absolute;left:12px;top:12px;z-index:5;display:flex;flex-direction:column;gap:4px}
.zoomctl button{width:30px;height:30px;border:1px solid var(--rule);border-radius:7px;background:var(--surface);cursor:pointer;font-size:16px;line-height:1;color:var(--ink-2)}
.mapwrap path{vector-effect:non-scaling-stroke}
.mk{cursor:pointer} .mk:focus{outline:none} .mk:focus-visible circle.ring{stroke:var(--accent);stroke-width:3}
.lbl{font-family:var(--f-sans);font-size:12px;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.lbl.sea{stroke:var(--sea);fill:var(--ink-3);font-style:italic}
.tip{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:6px 9px;font-size:13px;max-width:320px;box-shadow:0 2px 10px rgba(0,0,0,.15);pointer-events:none}
/* pages */
.pagewrap{max-width:1100px;margin:0 auto}
.pagewrap h1{font-family:var(--f-display);font-weight:500;font-size:30px;margin:0 0 4px;letter-spacing:.015em;text-wrap:balance}
.lede{font-family:var(--f-serif);font-size:16.5px;color:var(--ink-2);max-width:70ch;margin:6px 0 18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px}
.fig{border:1px solid var(--rule);border-radius:10px;background:var(--surface);padding:14px 14px 10px;min-width:0;margin:0 0 18px}
.fig h3{font-family:var(--f-serif);font-size:18px;margin:0 0 2px;font-weight:600;text-wrap:balance}
.fig .sub{font-size:13px;color:var(--ink-3);margin:0 0 8px;max-width:76ch}
.fig .plot{width:100%;overflow-x:auto}
.fig svg{display:block}
.fig svg text{fill:var(--ink-2);font-family:var(--f-sans)}
.axis path,.axis line{stroke:var(--rule)} .axis text{font-size:11.5px}
.gridline line{stroke:var(--rule);stroke-dasharray:2 3}
.lgd{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin:6px 0 0}
.lgd span{display:inline-flex;align-items:center;gap:5px}
details.tbl{margin-top:6px;font-size:13px} details.tbl summary{cursor:pointer;color:var(--ink-3)}
.tblwrap{overflow-x:auto;max-height:420px;overflow-y:auto}
table.data{border-collapse:collapse;font-size:13px;width:100%}
table.data th,table.data td{border-bottom:1px solid var(--rule);padding:5px 6px;text-align:left;vertical-align:top}
table.data th{font-weight:700;color:var(--ink-2);position:sticky;top:0;background:var(--surface);z-index:1}
table.data td.n{text-align:right;font-variant-numeric:tabular-nums}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 12px}
.toolbar select,.toolbar input{border:1px solid var(--rule);border-radius:7px;padding:4px 6px;background:var(--surface);min-width:0}
.toolbar input[type=search]{flex:1 1 200px;max-width:320px}
.ranges{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 8px}
.cards2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:10px}
.cards2 .card{margin:0}
.seq{display:grid;grid-template-columns:118px minmax(0,1fr);gap:0 14px}
.seq .when{font-family:var(--f-serif);font-size:14px;color:var(--ink-2);padding-top:12px;text-align:right;font-variant-numeric:tabular-nums}
.seq .when b{display:block;font-family:var(--f-display);font-weight:500;font-size:17px;color:var(--ink)}
.seq .what{border-left:2px solid var(--rule);padding-left:14px;min-width:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:baseline}
.checklist li{margin:6px 0}
.commentary:empty{display:none}
.more{margin-top:10px}
.rulenote{font-size:12px;fill:var(--ink-3)}
@media (max-width:860px){
  .view{display:block;overflow:auto}
  .view .mapwrap{position:relative;height:62vh;min-height:320px}
  .brand b{font-size:18px}
  .panel{border-left:0;border-top:1px solid var(--rule);overflow:visible}
  .brand span{display:none}
  .seq{grid-template-columns:82px minmax(0,1fr)}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
"use strict";
// ---------------------------------------------------------------- shared
const CONFIG={showUnverified:true, commentary:null, review:true};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS={src:['src','Checked in sources'],db:['db','Database'],verify:['verify','To verify']};
const pill=s=>{if(s==='verify'&&!CONFIG.showUnverified) return ''; const t=STATUS[s]||['','']; return `<span class="pill ${t[0]}">${t[1]}</span>`};
const SRCNAME={CPR:'Calendar of Patent Rolls',TNA:'TNA catalogue',GM:'Glyph Machina',Sweep:'Earlier Glyph Machina sweep',Event:'Dated events'};
let A,G,T={},TOWN={};
let COMMENTARY={};
const comment=v=>{const h=COMMENTARY[v]; if(h) return `<div class="note commentary" data-view="${v}">${h}</div>`; return CONFIG.review?`<div class="note commentary" data-view="${v}"><b>Author’s commentary.</b> Space reserved for the author. Not yet written.</div>`:''};
const tc=k=>`var(${(T[k]||{color:'--c0'}).color})`;
const tlab=k=>(T[k]||{label:k}).label;
const tip=$('#tip');
function showTip(html,e){tip.innerHTML=html;tip.hidden=false;const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tip.style.left=Math.max(4,x)+'px';tip.style.top=Math.max(4,y)+'px'}
function hideTip(){tip.hidden=true}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
const linkRef=r=>r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.ref)}</a>`:esc(r.ref);
const townName=k=>k&&TOWN[k]?TOWN[k].name:'';
function recCard(r,{showTown=true}={}){
  return `<div class="card" style="--tc:${tc(r.type)}"><div class="lab num">${esc(r.date||r.y||'')}${showTown&&r.town?' · '+esc(townName(r.town)):''} · ${esc(tlab(r.type))}</div>
  <div class="small">${esc(r.title)}</div>${r.quote?`<div class="quote">${esc(r.quote)}</div>`:''}<div class="ref">${pill(r.status)} ${linkRef(r)}</div></div>`}
function figure(el,title,sub){el.innerHTML=`<h3>${title}</h3><p class="sub">${sub}</p><div class="plot"></div><div class="lgd"></div><details class="tbl"><summary>Show the numbers</summary><div class="tblwrap"></div></details>`;return {plot:el.querySelector('.plot'),lgd:el.querySelector('.lgd'),tbl:el.querySelector('.tblwrap')}}
function table(el,head,rows,numcols=[]){el.innerHTML=`<table class="data"><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${numcols.includes(i)?'n':''}">${typeof c==='string'&&c.startsWith('<')?c:esc(c??'')}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function legend(el,items){el.innerHTML=items.map(([n,c,shape])=>`<span><span class="sw" style="background:${c};${shape==='sq'?'border-radius:2px':''}"></span>${esc(n)}</span>`).join('')}
function labelPlacer(){const used={}; return (x0,x1,row=0)=>{const r=used[row]||(used[row]=[]); if(r.some(([p,q])=>x0<q+4&&x1>p-4)) return false; r.push([x0,x1]); return true}}
const REIGNS=[['Henry III',1216,1272],['Edward I',1272,1307],['Edward II',1307,1327],['Edward III',1327,1377],['Richard II',1377,1399],['Henry IV',1399,1413],['Henry V',1413,1422],['Henry VI',1422,1461],['Edward IV',1461,1483],['Richard III',1483,1485],['Henry VII',1485,1509],['Henry VIII',1509,1547],['Edward VI',1547,1553],['Mary',1553,1558],['Elizabeth I',1558,1603],['James I',1603,1625]];
const reignOf=y=>{const r=REIGNS.find(r=>y>=r[1]&&y<r[2]); return r?r[0]:''};
function rule1290(svg,x,y0,y1,label=true){ if(x.domain()[0]>1290||x.domain()[1]<1290) return; svg.append('line').attr('x1',x(1290)).attr('x2',x(1290)).attr('y1',y0).attr('y2',y1).attr('stroke','var(--ink)').attr('stroke-width',1).attr('stroke-dasharray','3 3').attr('opacity',.55);
  if(label) svg.append('text').attr('class','rulenote').attr('x',x(1290)+4).attr('y',y0+10).text('1290')}
const plotW=el=>Math.max(560,(el.clientWidth||el.parentNode.clientWidth||700)-2);

// ---------------------------------------------------------------- tabs
const built={}, RESIZE={}; const VIEWS=['overview','sequence','map','houses','domus','records','sources'];
function show(v){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.v===v));
  document.querySelectorAll('main>section').forEach(s=>s.hidden=s.id!=='v-'+v);
  if(!built[v]){built[v]=true; ({overview:buildOverview,sequence:buildSequence,map:buildMap,houses:buildHouses,domus:buildDomus,records:buildRecords,sources:buildSources})[v]()}
  else if(RESIZE[v]) RESIZE[v]();
  store('ex-view',v); if(location.hash!=='#'+v) history.replaceState(null,'','#'+v);
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>show(t.dataset.v));
document.querySelector('.tabs').addEventListener('keydown',e=>{const tabs=[...document.querySelectorAll('.tab')];const i=tabs.findIndex(t=>t.getAttribute('aria-selected')==='true');if(e.key==='ArrowRight'){tabs[(i+1)%tabs.length].focus();tabs[(i+1)%tabs.length].click()}if(e.key==='ArrowLeft'){tabs[(i-1+tabs.length)%tabs.length].focus();tabs[(i-1+tabs.length)%tabs.length].click()}});
addEventListener('hashchange',()=>{const h=location.hash.slice(1); if(VIEWS.includes(h)&&!document.querySelector(`#v-${h}`).hidden===false) show(h)});
let rzT; addEventListener('resize',()=>{clearTimeout(rzT); rzT=setTimeout(()=>{const v=document.querySelector('.tab[aria-selected="true"]').dataset.v; if(RESIZE[v]) RESIZE[v]()},250)});

// ---------------------------------------------------------------- OVERVIEW
const OV_RANGES=[['1190–1660',1190,1660],['1270–1310',1270,1310],['1290–1400',1290,1400],['1400–1660',1400,1660]];
let ovRange=[1190,1660], ovSel=null;
function buildOverview(){
  const R=A.records, n=k=>R.filter(r=>r.src===k).length;
  $('#ovBody').innerHTML=`<h1>The Expulsion of 1290</h1>

function drawLifelines(){

  const fig=figure(el,'Ten charges, from their origin to the last entry found',`Each dot is a Glyph Machina entry naming the charge (hover for the roll and the machine-read line; choose a dot to open the image). A diamond marks the origin where the entries give one; a dashed line joins it to the first entry found. Colour is the origin the entries state. The pipe rolls before 1291 were not searched for these charges.`);
  const W=plotW(fig.plot), M={l:210,r:16,t:22,b:28}, RH=30, h=M.t+P.length*RH+M.b;
  const svg=d3.select(fig.plot).append('svg').attr('width',W).attr('height',h).attr('role','img').attr('aria-label','Lifelines of ten charges');
  const x=d3.scaleLinear().domain([1225,1600]).range([M.l,W-M.r]);
  REIGNS.filter(r=>r[2]>1225).forEach((r,i)=>{const a=x(Math.max(r[1],1225)), b=x(Math.min(r[2],1600)); svg.append('rect').attr('x',a).attr('y',M.t-14).attr('width',Math.max(0,b-a-1)).attr('height',h-M.b-M.t+14).attr('fill',i%2?'var(--bg)':'transparent').attr('opacity',.7);
    const t=svg.append('text').attr('x',a+3).attr('y',M.t-4).attr('font-size',10.5).text(r[0]); if(t.node().getComputedTextLength()>b-a-6) t.remove()});
  rule1290(svg,x,M.t-14,h-M.b,false);

    svg.append('text').attr('x',0).attr('y',y+4).attr('font-size',12.5).text(p.short).style('fill','var(--ink)');
    if(p.origin_year){svg.append('line').attr('x1',x(p.origin_year)).attr('x2',x(p.first)).attr('y1',y).attr('y2',y).attr('stroke',col).attr('stroke-dasharray','3 3').attr('stroke-width',1.5);
      svg.append('path').attr('d',d3.symbol(d3.symbolDiamond,64)()).attr('transform',`translate(${x(p.origin_year)},${y})`).attr('fill',col)
        .on('mousemove',e=>showTip(`<b>Origin, ${p.origin_year}</b><br>${esc(p.origin_note)}`,e)).on('mouseleave',hideTip)}
    svg.append('line').attr('x1',x(p.first)).attr('x2',x(p.last)).attr('y1',y).attr('y2',y).attr('stroke',col).attr('stroke-width',2.5).attr('opacity',.55);
    svg.append('g').selectAll('circle').data(p.hits).join('circle').attr('cx',d=>x(d.y)).attr('cy',y).attr('r',4).attr('fill',col).attr('stroke','var(--surface)').attr('stroke-width',1.2).style('cursor','pointer')
      .on('mousemove',(e,d)=>showTip(`<b>${d.y}</b> · ${esc(reignOf(d.y))}<br>${esc(d.ref)}<div class="quote">${esc(d.line)}</div>`,e)).on('mouseleave',hideTip)
      .on('click',(e,d)=>window.open(d.url,'_blank','noopener'));
    svg.append('text').attr('x',Math.min(x(p.last)+8,W-M.r-30)).attr('y',y-7).attr('font-size',11).attr('class','num').text(p.last);
  });
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${h-M.b})`).call(d3.axisBottom(x).ticks(9).tickFormat(d3.format('d')));
  legend(fig.lgd,A.origins.map(o=>[o.label,`var(${OCOL[o.key]})`]));
  table(fig.tbl,['Charge','Origin','Entries','First','Last'],P.map(p=>[p.label,(p.origin_year||'')+' '+A.origins.find(o=>o.key===p.origin).label,p.n,p.first,p.last]),[2,3,4]);
}
function drawHeat(){
  const el=$('#ho-heat'); const H=A.records.filter(r=>r.src==='GM'&&r.y>=1291);
  const towns=d3.rollups(H.filter(r=>r.town),v=>v.length,r=>r.town).sort((a,b)=>b[1]-a[1]).map(d=>d[0]);
  const fig=figure(el,'Entries with the formula, 1291–1600, by place and decade',`${H.length} Glyph Machina entries, placed by the town or charge named in the matched lines; ${H.filter(r=>!r.town).length} name no place in those lines. Darker cells hold more entries. Bristol’s two charges, copied from roll to roll, account for most of the later entries.`);
  const decs=d3.range(1290,1600,10); const W=plotW(fig.plot), M={l:96,r:8,t:8,b:26}, ch=18, h=M.t+towns.length*ch+M.b;
  const svg=d3.select(fig.plot).append('svg').attr('width',W).attr('height',h);
  const x=d3.scaleBand().domain(decs).range([M.l,W-M.r]).padding(.08);
  const cnt={}; H.forEach(r=>{if(!r.town) return; const k=r.town+'|'+Math.floor(r.y/10)*10; cnt[k]=(cnt[k]||0)+1});
  const mx=d3.max(Object.values(cnt))||1; const op=d3.scaleSqrt().domain([0,mx]).range([0,1]);
  towns.forEach((t,i)=>{const y=M.t+i*ch; svg.append('text').attr('x',M.l-6).attr('y',y+13).attr('text-anchor','end').attr('font-size',12).text(townName(t));
    decs.forEach(d=>{const n=cnt[t+'|'+d]||0; svg.append('rect').attr('x',x(d)).attr('y',y+1).attr('width',x.bandwidth()).attr('height',ch-2).attr('rx',2)
      .attr('fill',n?tc('property'):'var(--bg)').attr('fill-opacity',n?Math.max(.15,op(n)):1)
      .on('mousemove',e=>showTip(`<b>${esc(townName(t))}, ${d}s</b><br><span class="num">${n}</span> entr${n===1?'y':'ies'}`,e)).on('mouseleave',hideTip)})});
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${h-M.b})`).call(d3.axisBottom(x).tickValues(decs.filter(d=>d%50===0)).tickFormat(d=>d));
  fig.lgd.innerHTML='';
  table(fig.tbl,['Place',...decs.map(d=>d+'s')],towns.map(t=>[townName(t),...decs.map(d=>cnt[t+'|'+d]||0)]),decs.map((_,i)=>i+1));
}

function buildDomus(){

  <div class="more"><button class="btn" id="rmore">Show more</button></div>`;
  const bind=(id,k,ev='input')=>{const e=$('#'+id); if(!e) return; e.addEventListener(ev,()=>{recState[k]=e.value; recState.limit=150; drawRecs()})};

function drawRecs(){
  const s=recState, q=s.q.trim().toLowerCase();
  const rs=A.records.filter(r=>(CONFIG.showUnverified||r.status!=='verify')&&(!s.type||r.type===s.type)&&(!s.src||r.src===s.src)&&(!s.status||r.status===s.status)&&(!s.town||r.town===s.town)
    &&(!s.from||(r.y&&r.y>=+s.from))&&(!s.to||(r.y&&r.y<=+s.to))&&(!q||(r.title+' '+r.quote+' '+r.ref+' '+townName(r.town)).toLowerCase().includes(q)));
  $('#rcount').textContent=`${rs.length.toLocaleString()} of ${A.records.length.toLocaleString()} records`;
  $('#rtab tbody').innerHTML=rs.slice(0,s.limit).map(r=>`<tr><td class="num" style="white-space:nowrap">${esc(r.date||r.y||'')}</td><td><span class="dot" style="background:${tc(r.type)}"></span>${esc(tlab(r.type))}</td><td>${esc(townName(r.town))}</td>
    <td style="min-width:260px">${esc(r.title)}${r.quote?`<div class="quote">${esc(r.quote)}</div>`:''}</td><td style="min-width:150px">${linkRef(r)}<br>${pill(r.status)} <span class="small muted">${esc(SRCNAME[r.src]||r.src)}</span></td></tr>`).join('');
  $('#rmore').hidden=rs.length<=s.limit;
}

const TNAURL='https://discovery.nationalarchives.gov.uk/';
const OGL=`Contains public sector information licensed under the <a href="https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/" target="_blank" rel="noopener">Open Government Licence v3.0</a>.`;
function buildSources(){
  const R=CONFIG.review;
  $('#srcBody').innerHTML=`<h1>Sources &amp; method</h1>
  ${comment('sources')}
  <h3 class="lab">What each view draws on</h3>

  <tr><td>1290–93</td><td>Events, Patent Rolls, TNA (E 101/249–250, SC 1, SC 8), Glyph Machina (the account of Hugh de Kendale, E372 roll 139; E101 roll 250; C66 roll 112).</td><td>Date order; day and month as the sources give them.</td></tr>
  <tr><td>Map</td><td>Every record that names one place.</td><td>Towns placed at their centres (London at Old Jewry). County rolls placed at the county’s main Jewry.</td></tr>
  <tr><td>Houses &amp; rents</td><td>Glyph Machina, “NEAR(fuerunt iudei, 4)”, rolls dated 1291–1600: ${A.gm_counts.escheat_list_total} entries, all read; charges tagged by name, holder and place with patterns that allow for the transcription’s recurrent misreadings.</td><td>Entries counted once per charge they name; one entry can name several Lincoln charges.</td></tr>
  <tr><td>House of Converts</td><td>Adler 1899 (residents, App. XXI); TNA E 101/249–255 (keepers’ accounts); CPR appointments and admissions; TNA SC 8; Glyph Machina.</td><td>Keepers merged across spellings (e.g. Ayrmynne/Ayremynne).</td></tr>
  <tr><td>Records</td><td>All of the above, ${A.records.length} records.</td><td>Searchable; links to Discovery and to the Glyph Machina image pages.</td></tr></tbody></table></div>
  <h3 class="lab">Marks</h3>
  <p class="small">${pill('src')} found in a printed source read for this atlas: the Calendar of Patent Rolls (with volume and page), B. L. Abrahams, <i>The Expulsion of the Jews from England in 1290</i> (1895), or M. Adler, <i>History of the “Domus Conversorum” from 1290 to 1891</i> (1899). ${pill('db')} from a database: The National Archives’ catalogue or Glyph Machina’s machine transcription. ${CONFIG.showUnverified?pill('verify')+' reference knowledge, or a claim from the earlier Glyph Machina sweep that was not re-read here.':''}</p>
  ${R?`<h3 class="lab">Needs your judgment or checking</h3><ul class="checklist small">${A.flags.map(f=>`<li><b>${esc(f.title)}.</b> ${esc(f.text)}</li>`).join('')}</ul>`:''}
  <div class="fig" id="src-base"></div>
  ${R?`<h3 class="lab">The earlier Glyph Machina sweep</h3><p class="small muted">Items from the assistant sweep pasted on 8 October 2026. “Matched” means a Glyph Machina hit read for this atlas has the same roll and image.</p>
  <div class="tblwrap" style="max-height:none"><table class="data"><thead><tr><th>Item</th><th>Reference</th><th>Status</th></tr></thead><tbody>${A.prior.map(p=>`<tr><td>${esc(p.title)}${p.quote?`<div class="quote">${esc(p.quote)}</div>`:''}</td><td>${esc(p.ref)}${p.matched?`<br><a href="${esc(p.matched)}" target="_blank" rel="noopener">${esc(p.matched_ref)}</a>`:''}</td><td>${pill(p.status)}</td></tr>`).join('')}</tbody></table></div>`:''}
  <h3 class="lab">Glyph Machina searches</h3>
  <p class="small">${A.gm_log.length} searches, 8 October 2026. The site’s robots file disallows automated access, so use was kept small and spaced, as for the Berwick and Merchant London atlases.</p>
  <div class="tblwrap"><table class="data"><thead><tr><th>Search</th><th>Mode</th><th>Grouping and filters</th></tr></thead><tbody>${A.gm_log.map(q=>`<tr><td><a href="${esc(q.url)}" target="_blank" rel="noopener">${esc(q.q)}</a></td><td>${esc(q.mode)}</td><td>${esc([q.group?('by '+q.group):'list',...Object.entries(q.extra||{}).map(([k,v])=>k+' '+v)].join(', '))}</td></tr>`).join('')}</tbody></table></div>
  <h3 class="lab">Sources and credits</h3>
  <ul class="small">
   <li><a href="https://glyphmachina.utsc.utoronto.ca/" target="_blank" rel="noopener">Glyph Machina</a>: searches run through Glyph Machina, with thanks to the Glyph Machina team and to the Anglo-American Legal Tradition project founded by the late Robert Palmer.</li>
   <li><a href="${TNAURL}" target="_blank" rel="noopener">The National Archives, Discovery</a>: catalogue descriptions of E 101, E 9, SC 8, SC 1 and C 47 (${A.tna_count} records used). ${OGL}</li>

function drawBaseline(){
  const o=A.gm_other.baseline_decade; const e=Object.entries(o.counts).filter(([d])=>/^\d+$/.test(d)&&+d<1700).map(([d,n])=>[+d,n]);
  const fig=figure($('#src-base'),'A warning: every form of “iudeus”, unanchored',`An any-word search for iudeus, iudei, iudeorum, iudeo, iudea, iudee, iudeis and iudeum returns ${o.total.toLocaleString()} entries, rising after 1290. A sample of 25 Common Pleas hits from the 1330s reads “Iudeo” for <i>ideo</i> and the feast of SS Simon and Jude; none clearly names a Jew. <a href="${esc(o.url)}" target="_blank" rel="noopener">Open the search</a>.`);
  const W=plotW(fig.plot), M={l:44,r:8,t:8,b:24}, h=170; const svg=d3.select(fig.plot).append('svg').attr('width',W).attr('height',h);
  const x=d3.scaleLinear().domain([1190,1690]).range([M.l,W-M.r]); const y=d3.scaleLinear().domain([0,d3.max(e,d=>d[1])]).nice().range([h-M.b,M.t]); const bw=Math.max(2,x(1200)-x(1190)-2);
  svg.selectAll('rect').data(e).join('rect').attr('x',d=>x(d[0])+1).attr('width',bw).attr('y',d=>y(d[1])).attr('height',d=>y(0)-y(d[1])).attr('fill','var(--c0)')
    .on('mousemove',(ev,d)=>showTip(`<b>${d[0]}s</b>: <span class="num">${d[1]}</span>`,ev)).on('mouseleave',hideTip);
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${h-M.b})`).call(d3.axisBottom(x).ticks(8).tickFormat(d3.format('d')));
  svg.append('g').attr('class','axis').attr('transform',`translate(${M.l},0)`).call(d3.axisLeft(y).ticks(4));
  rule1290(svg,x,M.t,h-M.b); fig.lgd.innerHTML='';
  table(fig.tbl,['Decade','Entries'],e.map(d=>[d[0]+'s',d[1]]),[1]);
}

const loadCommentary=()=>CONFIG.commentary?fetch(CONFIG.commentary).then(r=>r.ok?r.text():'').then(t=>{ if(!t) return; const d=document.createElement('div'); d.innerHTML=t;
  d.querySelectorAll('section[data-view]').forEach(sec=>{const html=sec.innerHTML.replace(/<!--[\s\S]*?-->/g,'').trim(); if(html) COMMENTARY[sec.dataset.view]=html})}).catch(()=>{}):Promise.resolve();
Promise.all([fetch('data/atlas.json').then(r=>r.json()),fetch('data/geo.json').then(r=>r.json()),loadCommentary()]).then(([a,g])=>{
  A=a; G=g;
  if(!CONFIG.showUnverified){ A.records=A.records.filter(r=>r.status!=='verify'); A.events=A.events.filter(e=>e.status!=='verify') }
  A.types.forEach(t=>T[t.key]=t);
  Object.entries(A.towns).forEach(([k,t])=>TOWN[k]=t);
  const h=location.hash.slice(1); const v=VIEWS.includes(h)?h:(store('ex-view')||'overview');
  show(VIEWS.includes(v)?v:'overview');
}).catch(e=>{document.querySelector('main').innerHTML=`<div class="pagewrap" style="padding:24px"><h1>Could not load the data</h1><p>${esc(e.message)}</p></div>`});
</script>
